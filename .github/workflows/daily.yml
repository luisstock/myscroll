name: MyScroll daily edition
# The run's title doubles as the request's identity (used to skip repeated Load more requests).
run-name: "${{ inputs.url && format('Share: {0}', inputs.url) || inputs.query && format('Search: {0}', inputs.query) || inputs.sub && format('Load more {0} {1}', inputs.more, inputs.sub) || inputs.more && format('Load more {0} {1}', inputs.more, inputs.topics || 'all') || (github.event_name == 'push' && 'Publish app' || 'Daily edition') }}"

on:
  schedule:
    # 05:00 UTC = 06:00 in Lisbon in winter (07:00 in summer). GitHub may start it a few minutes late.
    - cron: "0 5 * * *"
  # Changes to the app itself: only republish GitHub Pages (no research).
  # Commits made by this workflow don't trigger it again.
  push:
    branches: [main]
    paths: ["web/**", "!web/editions/**"]
  workflow_dispatch:
    inputs:
      more:
        description: "Load more: how many extra items to add to today's edition (empty = normal daily run)"
        required: false
        default: ""
      topics:
        description: "Load more only for these topic ids, comma separated (empty = all)"
        required: false
        default: ""
      sub:
        description: "Load more only for this subcategory, as topic/sub (e.g. ai/frontier). Needs 'more'"
        required: false
        default: ""
      query:
        description: "Search: research this text on the web and add the best 'more' items (default 10)"
        required: false
        default: ""
      url:
        description: "Share: add this one page (article, Reddit thread or YouTube link) to today's edition"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

# App republishes share one queue. Editions and Load more don't use GitHub's queue (it keeps only one
# waiting run and cancels the rest); they queue themselves in the "Wait for earlier requests" step.
concurrency:
  group: myscroll-${{ github.event_name == 'push' && 'publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Lisbon
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MYSCROLL_PROVIDER: ${{ vars.MYSCROLL_PROVIDER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # One edition run at a time, in the order they were requested.
      - name: Wait for earlier requests
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          me=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          for i in $(seq 1 90); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/runs?per_page=30" \
              | jq --arg me "$me" --argjson id "$GITHUB_RUN_ID" \
                '[.workflow_runs[] | select(.id != $id and .event != "push" and .status != "completed" and .created_at < $me)] | length')
            [ "$n" -eq 0 ] && exit 0
            echo "Waiting for $n earlier request(s)…"; sleep 20
          done

      # The request currently being done is the reference: a later identical Load more is skipped.
      - name: Skip a repeated Load more
        id: dupe
        if: github.event_name == 'workflow_dispatch' && (inputs.more != '' || inputs.query != '' || inputs.url != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          me=$(echo "$run" | jq -r .created_at)
          title=$(echo "$run" | jq -r .display_title)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/runs?event=workflow_dispatch&per_page=30" \
            | jq --arg me "$me" --arg t "$title" --argjson id "$GITHUB_RUN_ID" \
              '[.workflow_runs[] | select(.id != $id and .display_title == $t and .created_at < $me
                 and (.status != "completed" or (.conclusion == "success" and .updated_at > $me)))] | length')
          if [ "$n" -gt 0 ]; then echo "Same request was already being done: skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Research and write the edition
        if: github.event_name != 'push' && steps.dupe.outputs.skip != 'true'
        env:
          # Inputs reach the shell only as environment variables, never interpolated into the script.
          MORE: ${{ inputs.more }}
          TOPICS: ${{ inputs.topics }}
          SUB: ${{ inputs.sub }}
          QUERY: ${{ inputs.query }}
          SHARE_URL: ${{ inputs.url }}
        run: |
          if [ -n "$SHARE_URL" ]; then
            if ! [[ "$SHARE_URL" =~ ^https?://[^[:space:]]+$ ]]; then echo "bad url"; exit 1; fi
            node scripts/pipeline/run.mjs --url "$SHARE_URL"
          elif [ -n "$QUERY" ]; then
            if [ "${#QUERY}" -gt 200 ] || ! [[ "${MORE:-10}" =~ ^[0-9]{1,2}$ ]]; then echo "bad inputs"; exit 1; fi
            node scripts/pipeline/run.mjs --more "${MORE:-10}" --query "$QUERY"
          elif [ -n "$MORE" ]; then
            if ! [[ "$MORE" =~ ^[0-9]{1,2}$ && "$TOPICS" =~ ^[a-z0-9,-]*$ && "$SUB" =~ ^([a-z0-9-]+/[a-z0-9-]+)?$ ]]; then echo "bad inputs"; exit 1; fi
            node scripts/pipeline/run.mjs --more "$MORE" ${SUB:+--sub "$SUB"} ${TOPICS:+--topics "$TOPICS"}
          else
            node scripts/pipeline/run.mjs
          fi

      - name: Save the edition to the repo
        if: github.event_name != 'push' && steps.dupe.outputs.skip != 'true'
        run: |
          git config user.name "myscroll-bot"
          git config user.email "myscroll-bot@users.noreply.github.com"
          git add content data/history.json data/source-cache.json web/editions web/catalog.json web/agent-notes.json web/feeds.json
          git diff --cached --quiet || git commit -m "Edition $(date +%F)${{ (inputs.more || inputs.query || inputs.url) && ' (load more)' || '' }}"
          # The phone may have synced data/state.json while we were running: rebase on top of it.
          for i in 1 2 3; do git pull --rebase --autostash -q && git push && break; sleep 5; done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - uses: actions/deploy-pages@v4
        id: deploy
