<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <title>MyScroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Literata:opsz,wght@7..72,400;7..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tools.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1 class="brand">MyScroll</h1>
        <p class="dateline" id="dateline"></p>
      </div>
      <div class="top-btns">
        <button class="icon-btn" id="themeBtn" aria-label="Change theme" title="Theme"></button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙︎</button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    <div id="readBar" class="read-bar" hidden aria-hidden="true"><span></span></div>
    <nav class="chips" id="chips" aria-label="Topics"></nav>
  </header>

  <main id="feed" class="feed"></main>

  <template id="cardTpl">
    <article class="card">
      <button class="card-head" aria-expanded="false">
        <div class="card-text">
          <p class="meta"><span class="tag"></span><span class="mins"></span><span class="age"></span><span class="rated"></span><span class="read-mark" aria-label="read">✓</span></p>
          <h2 class="title"></h2>
          <p class="snippet"></p>
        </div>
        <div class="thumb"></div>
      </button>
      <div class="card-body" hidden>
        <figure class="hero"></figure>
        <div class="prose"></div>
        <button class="more-btn">Read more</button>
        <div class="more prose" hidden></div>
        <a class="source" target="_blank" rel="noopener"></a>
        <div class="rating">
          <div class="rate" role="group" aria-label="Rate 0 to 5"></div>
          <p class="rate-hint"></p>
        </div>
        <div class="actions">
          <button data-save class="wide">☆ Save</button>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
